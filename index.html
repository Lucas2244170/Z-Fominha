<!DOCTYPE html>
<!-- Deus é fiel. -->
<!-- Declara que este documento usa HTML5 -->

<html lang="pt-BR">

<head>

    <!-- Codificação de caracteres, garante acentos corretos -->

    <title>Escola Digital Livre</title>

>

<button class="btn-primary">
